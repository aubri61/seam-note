spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:}
  devtools:
    restart:
      enabled: false

seam:
  auth:
    jwt:
      secret-base64: ${TEST_JWT_SECRET_BASE64:}
      issuer: urn:seam-note:test
      audience: seam-note-test-api
