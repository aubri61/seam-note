spring:
  application:
    name: seam-note-backend
  datasource:
    url: jdbc:postgresql://localhost:15439/seam_note
    username: ${DB_USERNAME:seam_note}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

     # Spring Boot DevTools
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

server:
  port: 18765

seam:
  auth:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/api/auth/oauth2/callback/google}
    jwt:
      secret-base64: ${AUTH_JWT_SECRET_BASE64:}
      issuer: ${AUTH_JWT_ISSUER:urn:seam-note:local}
      audience: ${AUTH_JWT_AUDIENCE:seam-note-local-api}
      access-ttl-seconds: ${AUTH_JWT_ACCESS_TTL_SECONDS:300}

