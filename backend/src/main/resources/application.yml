spring:
  application:
    name: seam-note-backend
  datasource:
    url: jdbc:postgresql://localhost:15439/seam_note
    username: ${DB_USERNAME:seam_note}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

     # Spring Boot DevTools
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

server:
  port: 18765

